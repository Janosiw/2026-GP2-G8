<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainalyze | Invite Accepted</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', 'Cairo', Arial, sans-serif;
      background: #f7faff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 48px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(30,42,71,0.10);
      max-width: 420px;
      width: 90%;
    }
    .icon {
      font-size: 52px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1e2a47;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #6a7393;
      line-height: 1.65;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #3d6fa8;
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #1e2a47; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Case Access Granted</h1>
    <p>You now have access to the shared case.<br>You can view it and add your comments from the Patients page.</p>
    <a href="{{ url_for('patients') }}" class="btn">Go to Patients</a>
  </div>
</body>
</html>
